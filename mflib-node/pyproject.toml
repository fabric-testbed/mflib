[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"


[project]
name = "fabrictestbed-mflib-node"
license = {file = "LICENSE"}
authors = [
  { name="Carpenter", email="csacarp0@g.uky.edu"},
]

readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version", "description"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
mflib-node = "mflib_node.server:main"

[tool.flit.module]
name = "mflib_node"

[project.urls]
"Homepage" = "https://github.com/fabric-testbed/mflib"
